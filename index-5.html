<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .box { width: 100%; max-width: 380px; text-align: center; }
    .logo { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 0.3rem; }
    .logo span { color: #00d4ff; }
    .tag { color: #777; font-size: 0.95rem; margin-bottom: 2.2rem; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; border: none; padding: 0.95rem; border-radius: 50px;
      font-weight: 600; font-size: 1rem; cursor: pointer;
      background: #fff; color: #222;
    }
    .btn img { width: 22px; height: 22px; }
    .error {
      background: #2a1010; color: #ff6b6b; padding: 0.8rem;
      border-radius: 10px; margin-bottom: 1.2rem; font-size: 0.9rem; display: none;
    }
    .hint { margin-top: 1.8rem; font-size: 0.85rem; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Core<span>Talk</span></div>
    <p class="tag">Chat + Live Status</p>
    <div class="error" id="errorBox"></div>
    <button class="btn" onclick="signInGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" />
      Continue with Google
    </button>
    <p class="hint">After login, set your CoreTalk ID in Settings<br>so friends can find you easily</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    auth.onAuthStateChanged(u => { if (u) location.href = "chats.html"; });

    function signInGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        const el = document.getElementById("errorBox");
        el.style.display = "block";
        el.textContent = err.message;
      });
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
