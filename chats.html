<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chats – CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      padding-bottom: 70px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo { font-weight: 700; font-size: 1.2rem; }
    .logo span { color: #00d4ff; }
    .header-actions { display: flex; gap: 0.8rem; align-items: center; }
    .header-actions img {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid #00d4ff44;
    }
    .signout {
      background: none; border: 1px solid #333; color: #aaa;
      padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
    }

    .status-row {
      display: flex;
      gap: 0.9rem;
      padding: 1rem 1.2rem;
      overflow-x: auto;
      border-bottom: 1px solid #1a1a1a;
    }
    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      min-width: 62px;
      cursor: pointer;
    }
    .status-ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2.5px solid #00d4ff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: #1a1a1a;
    }
    .status-ring img { width: 100%; height: 100%; object-fit: cover; }
    .status-ring.add { border-style: dashed; color: #00d4ff; font-size: 1.5rem; }
    .status-name { font-size: 0.7rem; color: #aaa; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .chat-list { padding: 0.5rem 0; }
    .chat-item {
      display: flex;
      gap: 0.9rem;
      padding: 0.85rem 1.2rem;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #141414;
      transition: background 0.15s;
    }
    .chat-item:active { background: #151515; }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #00d4ff; font-size: 1.1rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-top { display: flex; justify-content: space-between; margin-bottom: 0.2rem; }
    .chat-name { font-weight: 600; font-size: 0.95rem; }
    .chat-time { font-size: 0.75rem; color: #666; }
    .chat-preview { font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      padding: 0.6rem 0 calc(0.6rem + env(safe-area-inset-bottom));
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; color: #666; font-size: 0.7rem; text-decoration: none;
    }
    .nav-item.active { color: #00d4ff; }
    .nav-item span { font-size: 1.3rem; }

    .empty {
      text-align: center; padding: 3rem 1.5rem; color: #666;
    }
  
    .fab-add {
      position: fixed;
      right: 1.2rem;
      bottom: 5rem;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #00d4ff;
      color: #000;
      border: none;
      font-size: 1.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px #00d4ff55;
      z-index: 30;
      display: flex; align-items: center; justify-content: center;
    }

  
    .toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: #00d4ff; color: #000; padding: 0.7rem 1.3rem;
      border-radius: 50px; font-weight: 600; font-size: 0.9rem;
      z-index: 100; display: none; animation: slideDown 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,212,255,0.3);
    }
    .toast.show { display: block; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <header>
    <div class="logo">Core<span>Talk</span></div>
    <div class="header-actions">
      <button onclick="startNewChat()" style="background:#00d4ff;color:#000;border:none;width:34px;height:34px;border-radius:50%;font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1;">+</button>
      <button onclick="shareApp()" style="background:none;border:1px solid #333;color:#00d4ff;padding:0.3rem 0.6rem;border-radius:20px;font-size:0.8rem;cursor:pointer;">Share</button>
      <img id="myPhoto" src="" alt="" />
      <button class="signout" onclick="signOut()">Out</button>
    </div>
  </header>

  <!-- Status / Stories row -->
  <div class="status-row" id="statusRow">
    <div class="status-item" onclick="location.href='status.html?action=add'">
      <div class="status-ring add">+</div>
      <div class="status-name">My Status</div>
    </div>
  </div>

  <div class="chat-list" id="chatList">
    <div class="empty">Loading chats...</div>
  </div>

  <button class="fab-add" onclick="startNewChat()" title="Add person">+</button>

  <nav class="bottom-nav">
    <a href="chats.html" class="nav-item active"><span>💬</span>Chats</a>
    <a href="status.html" class="nav-item"><span>○</span>Status</a>
    <a href="settings.html" class="nav-item"><span>⚙️</span>Settings</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let me = null;

    auth.onAuthStateChanged(user => {
      if (!user) return location.href = "index.html";
      me = user;
      if (user.photoURL) document.getElementById("myPhoto").src = user.photoURL;
      loadChats();
      loadStatuses();
      requestNotif();
    });

    function shareApp() {
      const url = "https://alvinlurison.github.io/CoreTalk/";
      if (navigator.share) {
        navigator.share({ title: "CoreTalk", text: "Join me on CoreTalk – fast chat + status", url });
      } else {
        navigator.clipboard.writeText(url).then(() => alert("Link copied! Share it with friends."));
      }
    }


    function showToast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
      // Browser notification if permitted
      if (Notification.permission === "granted") {
        new Notification("CoreTalk", { body: msg, icon: "logo.png" });
      }
    }

    function requestNotif() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    }

    function signOut() {
      auth.signOut().then(() => location.href = "index.html");
    }

    function loadChats() {
      // For v1 we show a simple "Start new chat" and recent conversations
      const list = document.getElementById("chatList");
      db.collection("coretalk_chats")
        .where("members", "array-contains", me.uid)
        .limit(40)
        .onSnapshot(snap => {
          if (snap.empty) {
            list.innerHTML = `
              <div class="empty">
                <p>No chats yet</p>
                <p style="margin-top:0.8rem; font-size:0.9rem;">Start by sharing CoreTalk with a friend</p>
                <button onclick="startNewChat()" style="margin-top:1.2rem; background:#00d4ff; color:#000; border:none; padding:0.7rem 1.4rem; border-radius:50px; font-weight:600; cursor:pointer;">
                  New Chat
                </button>
              </div>`;
            return;
          }
          let html = "";
          snap.forEach(doc => {
            const d = doc.data();
            const other = d.memberInfo?.find(m => m.uid !== me.uid) || {};
            const initial = (other.name || "?").charAt(0).toUpperCase();
            html += `
              <div class="chat-item" onclick="location.href='chat.html?id=${doc.id}'">
                <div class="avatar">${other.photo ? `<img src="${other.photo}">` : initial}</div>
                <div class="chat-info">
                  <div class="chat-top">
                    <span class="chat-name">${other.name || "User"}</span>
                    <span class="chat-time">${formatTime(d.updatedAt)}</span>
                  </div>
                  <div class="chat-preview">${d.lastMessage || "Start chatting"}</div>
                </div>
              </div>`;
          });
          list.innerHTML = html;
        }, err => {
          console.error(err);
          list.innerHTML = `<div class="empty">Could not load chats.<br>Check Firestore rules.</div>`;
        });
    }

    function loadStatuses() {
      // Lightweight: show recent statuses
      const row = document.getElementById("statusRow");
      db.collection("coretalk_status")
        .where("expiresAt", ">", new Date())
        .limit(20)
        .onSnapshot(snap => {
          // Keep the "My Status" button, append others
          let html = `
            <div class="status-item" onclick="location.href='status.html?action=add'">
              <div class="status-ring add">+</div>
              <div class="status-name">My Status</div>
            </div>`;
          snap.forEach(doc => {
            const d = doc.data();
            if (d.uid === me.uid) return;
            html += `
              <div class="status-item" onclick="location.href='status.html?uid=${d.uid}'">
                <div class="status-ring">
                  ${d.photo ? `<img src="${d.photo}">` : (d.name || "?").charAt(0)}
                </div>
                <div class="status-name">${(d.name || "User").split(" ")[0]}</div>
              </div>`;
          });
          row.innerHTML = html;
        });
    }

    function startNewChat() {
      const contact = prompt("Enter CoreTalk ID, email, or phone of the person:");
      if (!contact || !contact.trim()) return;
      const value = contact.trim().toLowerCase();

      // First try to find by username
      db.collection("coretalk_users").where("username", "==", value).limit(1).get()
        .then(snap => {
          let otherUid = value;
          let otherName = value;
          let otherPhoto = "";

          if (!snap.empty) {
            const u = snap.docs[0].data();
            otherUid = u.uid || snap.docs[0].id;
            otherName = u.name || u.username;
            otherPhoto = u.photo || "";
          }

          const chatId = [me.uid, otherUid].sort().join("_").replace(/[^a-z0-9_]/gi, "");
          const ref = db.collection("coretalk_chats").doc(chatId);

          return ref.get().then(doc => {
            if (doc.exists) {
              location.href = "chat.html?id=" + chatId;
              return;
            }
            return ref.set({
              members: [me.uid, otherUid],
              memberInfo: [
                { uid: me.uid, name: me.displayName || "User", photo: me.photoURL || "" },
                { uid: otherUid, name: otherName, photo: otherPhoto }
              ],
              lastMessage: "",
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
              location.href = "chat.html?id=" + chatId;
            });
          });
        })
        .catch(err => {
          console.error(err);
          alert("Could not start chat. Check connection.");
        });
    }


    function formatTime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
