<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Status – CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      padding-bottom: 70px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
    }
    .logo { font-weight: 700; font-size: 1.2rem; }
    .logo span { color: #00d4ff; }
    .back {
      background: none; border: none; color: #00d4ff;
      font-size: 1rem; cursor: pointer;
    }

    .add-box {
      margin: 1.2rem;
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      padding: 1.2rem;
    }
    .add-box textarea {
      width: 100%;
      min-height: 90px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      padding: 0.8rem;
      resize: none;
      outline: none;
      font-size: 0.95rem;
    }
    .add-box button {
      margin-top: 0.8rem;
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-list { padding: 0.5rem 1.2rem; }
    .status-card {
      background: #111;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 0.8rem;
    }
    .status-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.7rem;
    }
    .status-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      color: #00d4ff; font-weight: 700;
      overflow: hidden;
    }
    .status-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .status-meta { font-size: 0.8rem; color: #888; }
    .status-text { font-size: 1rem; line-height: 1.45; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      padding: 0.6rem 0 calc(0.6rem + env(safe-area-inset-bottom));
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; color: #666; font-size: 0.7rem; text-decoration: none;
    }
    .nav-item.active { color: #00d4ff; }
    .nav-item span { font-size: 1.3rem; }

    .empty { text-align: center; padding: 2.5rem; color: #666; }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="location.href='chats.html'">← Chats</button>
    <div class="logo">Status</div>
    <div style="width:60px"></div>
  </header>

  <div class="add-box" id="addBox">
    <textarea id="statusText" placeholder="What's happening? (visible for 24 hours)"></textarea>
    <button onclick="postStatus()">Post Status</button>
  </div>

  <div class="status-list" id="statusList">
    <div class="empty">Loading statuses...</div>
  </div>

  <nav class="bottom-nav">
    <a href="chats.html" class="nav-item"><span>💬</span>Chats</a>
    <a href="status.html" class="nav-item active"><span>○</span>Status</a>
    <a href="settings.html" class="nav-item"><span>⚙️</span>Settings</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let me = null;

    auth.onAuthStateChanged(user => {
      if (!user) return location.href = "index.html";
      me = user;
      loadStatuses();
    });

    function postStatus() {
      const text = document.getElementById("statusText").value.trim();
      if (!text) return alert("Write something first");

      const expires = new Date();
      expires.setHours(expires.getHours() + 24);

      db.collection("coretalk_status").add({
        text,
        uid: me.uid,
        name: me.displayName || "User",
        photo: me.photoURL || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: expires
      }).then(() => {
        document.getElementById("statusText").value = "";
        alert("Status posted (visible 24h)");
      }).catch(err => {
        console.error(err);
        alert("Failed to post. Check Firestore rules.");
      });
    }

    function loadStatuses() {
      const list = document.getElementById("statusList");
      db.collection("coretalk_status")
        .where("expiresAt", ">", new Date())
        .limit(40)
        .onSnapshot(snap => {
          if (snap.empty) {
            list.innerHTML = `<div class="empty">No active statuses right now.<br>Be the first to post!</div>`;
            return;
          }
          let html = "";
          snap.forEach(doc => {
            const d = doc.data();
            const initial = (d.name || "?").charAt(0).toUpperCase();
            html += `
              <div class="status-card">
                <div class="status-header">
                  <div class="status-avatar">${d.photo ? `<img src="${d.photo}">` : initial}</div>
                  <div>
                    <strong>${d.name || "User"}</strong>
                    <div class="status-meta">${timeAgo(d.createdAt)}</div>
                  </div>
                </div>
                <div class="status-text">${escapeHtml(d.text)}</div>
              </div>`;
          });
          list.innerHTML = html;
        }, err => {
          console.error(err);
          list.innerHTML = `<div class="empty">Could not load statuses.</div>`;
        });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function timeAgo(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return "Just now";
      if (diff < 3600) return Math.floor(diff/60) + "m ago";
      if (diff < 86400) return Math.floor(diff/3600) + "h ago";
      return d.toLocaleDateString();
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
