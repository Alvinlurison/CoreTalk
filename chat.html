<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chat – CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--chat-bg, #0a0a0a);
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 1rem;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
    }
    .back { background: none; border: none; color: #00d4ff; font-size: 1.3rem; cursor: pointer; }
    .chat-title { font-weight: 600; font-size: 1rem; flex: 1; }
    .header-btn {
      background: none; border: none; color: #00d4ff;
      font-size: 1.1rem; cursor: pointer; padding: 0.3rem;
    }

    #messages {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .msg {
      max-width: 78%; padding: 0.55rem 0.9rem;
      border-radius: 14px; font-size: 0.95rem; line-height: 1.4;
      animation: fade 0.2s ease; word-break: break-word; position: relative;
    }
    .msg.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.theirs {
      align-self: flex-start;
      background: #1a1a1a; border: 1px solid #222;
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 0.4rem; margin-top: 0.25rem; font-size: 0.65rem; opacity: 0.75;
    }
    .msg .actions {
      display: none; gap: 0.3rem; margin-top: 0.3rem;
    }
    .msg:hover .actions, .msg.show-actions .actions { display: flex; }
    .msg .actions button {
      background: rgba(0,0,0,0.25); border: none; color: #fff;
      font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 6px; cursor: pointer;
    }
    .reactions {
      display: flex; gap: 0.2rem; margin-top: 0.25rem; flex-wrap: wrap;
    }
    .reaction {
      background: rgba(0,0,0,0.3); border-radius: 10px;
      padding: 0.1rem 0.35rem; font-size: 0.75rem;
    }
    .msg-media { margin-top: 0.35rem; border-radius: 10px; overflow: hidden; max-width: 100%; }
    .msg-media img, .msg-media video { width: 100%; max-height: 240px; object-fit: contain; background: #000; display: block; }
    .msg-media audio { width: 100%; margin-top: 0.3rem; }
    .msg-file { display: block; color: #7dd3fc; text-decoration: underline; margin-top: 0.3rem; word-break: break-all; }
    .view-once-badge { font-size: 0.7rem; opacity: 0.85; margin-top: 0.25rem; }
    .attach-bar { display: flex; gap: 0.4rem; padding: 0.35rem 0.8rem; background: #0d0d0d; flex-wrap: wrap; align-items: center; }
    .attach-bar label, .attach-bar button {
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc;
      padding: 0.3rem 0.65rem; border-radius: 16px; font-size: 0.8rem; cursor: pointer;
    }
    .attach-bar input { display: none; }
    .attach-bar .vo.active { border-color: #00d4ff; color: #00d4ff; }
    #attachPreview { display: none; padding: 0.4rem 0.8rem; font-size: 0.8rem; color: #888; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .toolbar {
      display: flex; gap: 0.4rem; padding: 0.4rem 0.8rem;
      background: #0d0d0d; border-top: 1px solid #1a1a1a;
      overflow-x: auto;
    }
    .toolbar button {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 0.3rem 0.5rem;
      font-size: 1.15rem; cursor: pointer; flex-shrink: 0;
    }

    .input-bar {
      display: flex; gap: 0.5rem; padding: 0.65rem 0.9rem;
      background: #111; border-top: 1px solid #1a1a1a;
      padding-bottom: calc(0.65rem + env(safe-area-inset-bottom));
    }
    .input-bar input {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 50px; padding: 0.7rem 1.1rem; color: #fff;
      outline: none; font-size: 0.95rem;
    }
    .input-bar input:focus { border-color: #00d4ff; }
    .input-bar button {
      background: #00d4ff; color: #000; border: none;
      width: 44px; height: 44px; border-radius: 50%;
      font-weight: 700; cursor: pointer; font-size: 1.1rem;
    }

    /* Timer modal */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 50;
      align-items: center; justify-content: center;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #151515; border-radius: 16px; padding: 1.4rem;
      width: 90%; max-width: 320px; text-align: center;
    }
    .modal h3 { margin-bottom: 1rem; }
    .modal button {
      display: block; width: 100%; margin: 0.4rem 0;
      padding: 0.7rem; border-radius: 10px; border: 1px solid #333;
      background: #1a1a1a; color: #eee; cursor: pointer; font-size: 0.95rem;
    }
    .modal button:hover { border-color: #00d4ff; }
  
    @media (orientation: landscape) and (max-height: 500px) {
      header { padding: 0.45rem 0.8rem; }
      #messages { padding: 0.6rem; }
      .toolbar { padding: 0.3rem 0.6rem; }
      .input-bar { padding: 0.45rem 0.7rem; }
    }
  
    .offline-bar {
      display: none; background: #5c1a1a; color: #ffb4b4;
      text-align: center; padding: 0.4rem; font-size: 0.8rem;
    }
    .offline-bar.show { display: block; }
  </style>
</head>
<body>
  <div class="offline-bar" id="offlineBar">You are offline — showing cached messages</div>
  <header>
    <button class="back" onclick="location.href='chats.html'">←</button>
    <div style="flex:1; min-width:0;">
      <div class="chat-title" id="chatTitle">Chat</div>
      <div id="chatStatus" style="font-size:0.75rem; color:#888;"></div>
    </div>
    <button class="header-btn" onclick="openTimer()" title="Disappearing messages">⏱️</button>
    <button class="header-btn" onclick="shareApp()" title="Share">↗</button>
  </header>

  <div id="messages"></div>

  <div class="toolbar" id="emojiBar">
    <button onclick="insert('😀')">😀</button>
    <button onclick="insert('😂')">😂</button>
    <button onclick="insert('❤️')">❤️</button>
    <button onclick="insert('🔥')">🔥</button>
    <button onclick="insert('👍')">👍</button>
    <button onclick="insert('🎉')">🎉</button>
    <button onclick="insert('🙏')">🙏</button>
    <button onclick="insert('💯')">💯</button>
    <button onclick="insert('🚀')">🚀</button>
    <button onclick="insert('✨')">✨</button>
  </div>

  <div class="attach-bar">
    <label>📷 Photo<input type="file" id="photoIn" accept="image/*" onchange="pickFile(this, 'image')" /></label>
    <label>🎬 Video<input type="file" id="videoIn" accept="video/*" onchange="pickFile(this, 'video')" /></label>
    <label>🎵 Audio<input type="file" id="audioIn" accept="audio/*" onchange="pickFile(this, 'audio')" /></label>
    <label>📎 File<input type="file" id="fileIn" onchange="pickFile(this, 'file')" /></label>
    <button type="button" class="vo" id="viewOnceBtn" onclick="toggleViewOnce()">View once</button>
  </div>
  <div id="attachPreview"></div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter')send()" />
    <button onclick="send()">➤</button>
  </div>

  <!-- Timer Modal -->
  <div class="modal-bg" id="timerModal">
    <div class="modal">
      <h3>Disappearing Messages</h3>
      <button onclick="setTimer(0)">Off</button>
      <button onclick="setTimer(24)">24 Hours</button>
      <button onclick="setTimer(168)">7 Days</button>
      <button onclick="closeTimer()" style="margin-top:0.8rem; color:#888;">Cancel</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const chatId = params.get("id");
    let me = null;
    let chatTimer = 0; // hours, 0 = off
    let pendingFile = null;
    let pendingType = null;
    let viewOnce = false;

    // Apply wallpaper
    const wall = localStorage.getItem("ct_wall") || "default";
    const walls = {
      default: "#0a0a0a",
      darkblue: "linear-gradient(145deg,#0a1628,#0d2137)",
      purple: "linear-gradient(145deg,#1a0a2e,#2d1b4e)",
      green: "linear-gradient(145deg,#0a1f14,#0d2e1c)",
      dim: "#121212",
      soft: "linear-gradient(145deg,#1c1c1c,#2a2a2a)",
      sunset: "linear-gradient(145deg,#2a1a0a,#4a2c0f)",
      ocean: "linear-gradient(145deg,#0a1a2a,#0d3a4a)",
      rose: "linear-gradient(145deg,#2a0a1a,#4a0f2c)",
      midnight: "linear-gradient(145deg,#050510,#0a0a20)",
      forest: "linear-gradient(145deg,#0a150a,#142814)",
      carbon: "#111"
    };
    document.body.style.background = walls[wall] || walls.default;

    window.addEventListener("online", () => document.getElementById("offlineBar").classList.remove("show"));
    window.addEventListener("offline", () => document.getElementById("offlineBar").classList.add("show"));
    if (!navigator.onLine) document.getElementById("offlineBar")?.classList.add("show");

    auth.onAuthStateChanged(user => {
      if (!user) return location.href = "index.html";
      me = user;
      if (!chatId) return location.href = "chats.html";
      loadMessages();
      loadChatInfo();
    });

    function loadChatInfo() {
      db.collection("coretalk_chats").doc(chatId).get().then(doc => {
        if (!doc.exists) return;
        const d = doc.data();
        chatTimer = d.timerHours || 0;
        if (d.type === "group") {
          document.getElementById("chatTitle").textContent = "👥 " + (d.groupName || "Group");
          document.getElementById("chatStatus").textContent = (d.members || []).length + " members";
        } else {
          const other = (d.memberInfo || []).find(m => m.uid !== me.uid);
          document.getElementById("chatTitle").textContent = other?.name || "Chat";
          if (other && other.uid) {
            db.collection("coretalk_presence").doc(other.uid).onSnapshot(pdoc => {
              const p = pdoc.data();
              const el = document.getElementById("chatStatus");
              if (!p) { el.textContent = "Offline"; el.style.color = "#888"; return; }
              let online = p.online === true;
              if (p.lastSeen && p.lastSeen.toDate) {
                if (Date.now() - p.lastSeen.toDate().getTime() > 120000) online = false;
              }
              if (online) {
                el.textContent = "Online";
                el.style.color = "#22c55e";
              } else if (p.lastSeen && p.lastSeen.toDate) {
                el.textContent = "Last seen " + p.lastSeen.toDate().toLocaleString();
                el.style.color = "#888";
              } else {
                el.textContent = "Offline";
                el.style.color = "#888";
              }
            });
          }
        }
      });
      // mark me online while in chat
      if (me) {
        db.collection("coretalk_presence").doc(me.uid).set({
          online: true,
          lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
          name: me.displayName || "User",
          photo: me.photoURL || ""
        }, { merge: true }).catch(() => {});
      }
    }

    function loadMessages() {
      const box = document.getElementById("messages");
      db.collection("coretalk_chats").doc(chatId).collection("messages")
        .orderBy("createdAt", "asc").limitToLast(100)
        .onSnapshot(snap => {
          box.innerHTML = "";
          const now = Date.now();
          snap.forEach(doc => {
            const d = doc.data();
            // Skip showing expired messages (avoid delete-in-loop reload)
            if (d.expiresAt && d.expiresAt.toDate && d.expiresAt.toDate().getTime() < now) {
              return;
            }
            const mine = d.uid === me.uid;
            const el = document.createElement("div");
            el.className = "msg " + (mine ? "mine" : "theirs");
            el.onclick = () => el.classList.toggle("show-actions");

            let html = "";
            if (!mine && d.name) html += `<div style="font-size:0.7rem; color:#00d4ff; margin-bottom:0.15rem; opacity:0.9;">${escapeHtml(d.name)}</div>`;
            if (d.text) html += `<div>${escapeHtml(d.text)}</div>`;
            // Media / view once
            if (d.mediaUrl) {
              const alreadyViewed = d.viewOnce && !mine && (d.viewedBy || []).includes(me.uid);
              if (d.viewOnce && alreadyViewed) {
                html += `<div class="view-once-badge">👁 View once · Opened</div>`;
              } else if (d.viewOnce && !mine) {
                html += `<div class="msg-media"><button onclick="event.stopPropagation();openViewOnce('${doc.id}','${d.mediaType || "file"}','${String(d.mediaUrl).replace(/'/g,"")}')" style="background:#1a1a1a;border:1px solid #00d4ff;color:#00d4ff;padding:0.5rem 1rem;border-radius:10px;cursor:pointer;">👁 View once</button></div>`;
              } else {
                if (d.mediaType === "image") html += `<div class="msg-media"><img src="${d.mediaUrl}" alt=""></div>`;
                else if (d.mediaType === "video") html += `<div class="msg-media"><video src="${d.mediaUrl}" controls playsinline></video></div>`;
                else if (d.mediaType === "audio") html += `<div class="msg-media"><audio src="${d.mediaUrl}" controls></audio></div>`;
                else html += `<a class="msg-file" href="${d.mediaUrl}" target="_blank" rel="noopener">📎 ${escapeHtml(d.mediaName || "File")}</a>`;
                if (d.viewOnce && mine) html += `<div class="view-once-badge">👁 View once</div>`;
              }
            }
            if (d.reactions && d.reactions.length) {
              html += `<div class="reactions">${d.reactions.map(r => `<span class="reaction">${r}</span>`).join("")}</div>`;
            }
            html += `<div class="meta"><span>${formatTime(d.createdAt)}</span></div>`;
            html += `<div class="actions">
              <button onclick="event.stopPropagation();react('${doc.id}','❤️')">❤️</button>
              <button onclick="event.stopPropagation();react('${doc.id}','😂')">😂</button>
              <button onclick="event.stopPropagation();react('${doc.id}','👍')">👍</button>
              <button onclick="event.stopPropagation();react('${doc.id}','🔥')">🔥</button>`;
            if (mine) {
              html += `<button onclick="event.stopPropagation();editMsg('${doc.id}','${escapeHtml(d.text).replace(/'/g,"\\'")}')">Edit</button>
                       <button onclick="event.stopPropagation();deleteMsg('${doc.id}')">Delete</button>`;
            }
            html += `</div>`;
            el.innerHTML = html;
            box.appendChild(el);
          });
          box.scrollTop = box.scrollHeight;
        });
    }


    function toggleViewOnce() {
      viewOnce = !viewOnce;
      const btn = document.getElementById("viewOnceBtn");
      btn.classList.toggle("active", viewOnce);
      btn.textContent = viewOnce ? "View once ✓" : "View once";
    }

    function pickFile(input, type) {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 12 * 1024 * 1024) {
        document.getElementById("attachPreview").style.display = "block";
        document.getElementById("attachPreview").textContent = "File too large (max 12MB)";
        input.value = "";
        return;
      }
      pendingFile = file;
      pendingType = type;
      const prev = document.getElementById("attachPreview");
      prev.style.display = "block";
      prev.textContent = (viewOnce ? "👁 View once · " : "") + type + ": " + file.name;
    }

    function clearPending() {
      pendingFile = null;
      pendingType = null;
      ["photoIn","videoIn","audioIn","fileIn"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      const prev = document.getElementById("attachPreview");
      if (prev) { prev.style.display = "none"; prev.textContent = ""; }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function uploadMedia(file, type) {
      // Prefer data URL for small images (works without Storage)
      if (type === "image" && file.size <= 600000) {
        return fileToDataUrl(file);
      }
      // Try Storage for larger files / video / audio
      const path = "coretalk_chat/" + chatId + "/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      try {
        const ref = firebase.storage().ref().child(path);
        return ref.put(file).then(s => s.ref.getDownloadURL()).catch(err => {
          console.error(err);
          if (type === "image" && file.size <= 900000) return fileToDataUrl(file);
          throw err;
        });
      } catch (e) {
        if (type === "image") return fileToDataUrl(file);
        return Promise.reject(e);
      }
    }

    function send() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text && !pendingFile) return;

      const doSend = (mediaUrl, mediaType, mediaName) => {
        const data = {
          text: text || "",
          uid: me.uid,
          name: me.displayName || "User",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          reactions: [],
          mediaUrl: mediaUrl || null,
          mediaType: mediaType || null,
          mediaName: mediaName || null,
          viewOnce: !!(mediaUrl && viewOnce),
          viewedBy: []
        };
        if (chatTimer > 0) {
          const exp = new Date();
          exp.setHours(exp.getHours() + chatTimer);
          data.expiresAt = exp;
        }
        const ref = db.collection("coretalk_chats").doc(chatId);
        ref.collection("messages").add(data).then(() => {
          const preview = mediaUrl ? ("📎 " + (mediaType || "file")) : text;
          ref.update({
            lastMessage: preview,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          input.value = "";
          clearPending();
          if (viewOnce) toggleViewOnce();
        }).catch(err => {
          console.error(err);
          document.getElementById("attachPreview").style.display = "block"; document.getElementById("attachPreview").textContent = "Send failed — try again";
        });
      };

      if (pendingFile) {
        const f = pendingFile;
        const t = pendingType;
        uploadMedia(f, t).then(url => doSend(url, t, f.name)).catch(err => {
          console.error(err);
          // small image fallback as data URL
          if (t === "image" && f.size < 700000) {
            const reader = new FileReader();
            reader.onload = e => doSend(e.target.result, "image", f.name);
            reader.readAsDataURL(f);
          } else {
            alert("Upload failed. Enable Firebase Storage or send a smaller image.");
          }
        });
      } else {
        doSend(null, null, null);
      }
    }


    function openViewOnce(msgId, type, url) {
      const ref = db.collection("coretalk_chats").doc(chatId).collection("messages").doc(msgId);
      ref.update({
        viewedBy: firebase.firestore.FieldValue.arrayUnion(me.uid)
      }).catch(() => {});
      // show in overlay
      let overlay = document.getElementById("voOverlay");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "voOverlay";
        overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;";
        overlay.onclick = () => overlay.remove();
        document.body.appendChild(overlay);
      }
      overlay.innerHTML = "";
      if (type === "image") overlay.innerHTML = '<img src="'+url+'" style="max-width:100%;max-height:90vh;border-radius:8px;">';
      else if (type === "video") overlay.innerHTML = '<video src="'+url+'" controls autoplay playsinline style="max-width:100%;max-height:90vh;"></video>';
      else if (type === "audio") overlay.innerHTML = '<audio src="'+url+'" controls autoplay></audio>';
      else overlay.innerHTML = '<a href="'+url+'" target="_blank" style="color:#00d4ff;">Open file</a>';
      document.body.appendChild(overlay);
    }

    function deleteMsg(id) {
      db.collection("coretalk_chats").doc(chatId).collection("messages").doc(id).delete();
    }

    function editMsg(id, oldText) {
      const newText = prompt("Edit message:", oldText);
      if (newText === null || !newText.trim()) return;
      db.collection("coretalk_chats").doc(chatId).collection("messages").doc(id)
        .update({ text: newText.trim() });
    }

    function react(id, emoji) {
      const ref = db.collection("coretalk_chats").doc(chatId).collection("messages").doc(id);
      ref.get().then(doc => {
        const reactions = doc.data().reactions || [];
        if (!reactions.includes(emoji)) reactions.push(emoji);
        ref.update({ reactions });
      });
    }

    function insert(emoji) {
      const input = document.getElementById("msgInput");
      input.value += emoji;
      input.focus();
    }
    function insertSticker(s) {
      document.getElementById("msgInput").value = s;
      send();
    }

    function openTimer() { document.getElementById("timerModal").classList.add("show"); }
    function closeTimer() { document.getElementById("timerModal").classList.remove("show"); }
    function setTimer(hours) {
      chatTimer = hours;
      db.collection("coretalk_chats").doc(chatId).update({ timerHours: hours });
      closeTimer();
      document.getElementById("chatTitle").dataset.tip = hours === 0 ? "Timer off" : (hours + "h timer");
    }

    function shareApp() {
      const url = "https://alvinlurison.github.io/CoreTalk/";
      if (navigator.share) {
        navigator.share({ title: "CoreTalk", text: "Chat with me on CoreTalk", url });
      } else {
        navigator.clipboard.writeText(url).then(() => alert("Link copied!"));
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function formatTime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date();
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
  </script>
</body>
</html>
