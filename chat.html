<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chat – CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
    }
    .back {
      background: none; border: none; color: #00d4ff;
      font-size: 1.3rem; cursor: pointer; padding: 0.2rem;
    }
    .chat-title { font-weight: 600; font-size: 1rem; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .msg {
      max-width: 78%;
      padding: 0.55rem 0.9rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      animation: fade 0.2s ease;
      word-break: break-word;
    }
    .msg.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.theirs {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #222;
      border-bottom-left-radius: 4px;
    }
    .msg .time {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 0.2rem;
      text-align: right;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .input-bar {
      display: flex;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      background: #111;
      border-top: 1px solid #1a1a1a;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
    }
    .input-bar input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 50px;
      padding: 0.7rem 1.1rem;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }
    .input-bar input:focus { border-color: #00d4ff; }
    .input-bar button {
      background: #00d4ff;
      color: #000;
      border: none;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <button class="back" onclick="location.href='chats.html'">←</button>
    <div class="chat-title" id="chatTitle">Chat</div>
  </header>

  <div id="messages"></div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter')send()" />
    <button onclick="send()">➤</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const chatId = params.get("id");
    let me = null;

    auth.onAuthStateChanged(user => {
      if (!user) return location.href = "index.html";
      me = user;
      if (!chatId) return location.href = "chats.html";
      loadMessages();
    });

    function loadMessages() {
      const box = document.getElementById("messages");
      db.collection("coretalk_chats").doc(chatId).collection("messages")
        .orderBy("createdAt", "asc")
        .limitToLast(100)
        .onSnapshot(snap => {
          box.innerHTML = "";
          snap.forEach(doc => {
            const d = doc.data();
            const mine = d.uid === me.uid;
            const el = document.createElement("div");
            el.className = "msg " + (mine ? "mine" : "theirs");
            el.innerHTML = `${escapeHtml(d.text)}<div class="time">${formatTime(d.createdAt)}</div>`;
            box.appendChild(el);
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    function send() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;
      const ref = db.collection("coretalk_chats").doc(chatId);
      ref.collection("messages").add({
        text,
        uid: me.uid,
        name: me.displayName || "User",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        ref.update({
          lastMessage: text,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function formatTime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date();
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
  </script>
</body>
</html>
