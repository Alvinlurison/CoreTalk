<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Settings – CoreTalk</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg, #0a0a0a);
      color: var(--text, #eee);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background 0.3s, color 0.3s;
    }
    body.day {
      --bg: #f2f4f7;
      --text: #111;
      --card: #fff;
      --border: #e0e0e0;
      --muted: #666;
    }
    body.night {
      --bg: #0a0a0a;
      --text: #eee;
      --card: #111;
      --border: #1a1a1a;
      --muted: #888;
    }
    header {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 1rem 1.2rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .back { background: none; border: none; color: #00d4ff; font-size: 1.1rem; cursor: pointer; }
    h1 { font-size: 1.15rem; }

    .section {
      margin: 1.2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .section-title {
      padding: 0.8rem 1.1rem 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.95rem 1.1rem;
      border-top: 1px solid var(--border);
      cursor: pointer;
    }
    .item:active { opacity: 0.7; }
    .item label { font-size: 0.95rem; }

    .theme-btns { display: flex; gap: 0.5rem; }
    .theme-btns button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .theme-btns button.active {
      background: #00d4ff;
      color: #000;
      border-color: #00d4ff;
    }

    .wallpapers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      padding: 0.8rem 1.1rem 1.1rem;
    }
    .wall {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background-size: cover;
      background-position: center;
    }
    .wall.active { border-color: #00d4ff; }

    .profile-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.1rem;
    }
    .profile-pic {
      width: 64px; height: 64px; border-radius: 50%;
      background: #1a1a1a; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: #00d4ff; font-size: 1.5rem; font-weight: 700;
    }
    .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
    .change-pic {
      background: none; border: 1px solid #00d4ff;
      color: #00d4ff; padding: 0.4rem 0.9rem;
      border-radius: 20px; font-size: 0.85rem; cursor: pointer;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 0.6rem 0 calc(0.6rem + env(safe-area-inset-bottom));
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; color: var(--muted); font-size: 0.7rem; text-decoration: none;
    }
    .nav-item.active { color: #00d4ff; }
    .nav-item span { font-size: 1.3rem; }

    input[type="file"] { display: none; }
  
    @media (orientation: landscape) and (max-height: 500px) {
      header { padding: 0.5rem 1rem; }
      .section { margin: 0.6rem; }
      .profile-row { padding: 0.7rem; }
    }
    @media (min-width: 700px) {
      body { max-width: 600px; margin: 0 auto; }
    }
  </style>
</head>
<body class="night">
  <header>
    <button class="back" onclick="location.href='chats.html'">←</button>
    <h1>Settings</h1>
  </header>

  <!-- Profile -->
  <div class="section">
    <div class="section-title">Profile</div>
    <div class="profile-row">
      <div class="profile-pic" id="profilePic">?</div>
      <div>
        <div id="profileName" style="font-weight:600; margin-bottom:0.4rem;">—</div>
        <button class="change-pic" onclick="document.getElementById('picInput').click()">Change Photo</button>
        <input type="file" id="picInput" accept="image/*" onchange="changePhoto()" />
      </div>
    </div>
  </div>

  <!-- CoreTalk ID Card -->
  <div class="section">
    <div class="section-title">Your CoreTalk ID</div>
    <div style="padding:1rem 1.1rem;">
      <div id="idCard" style="background:linear-gradient(135deg,#0a1a2a,#0d2137); border:1px solid #00d4ff44; border-radius:14px; padding:1.2rem; text-align:center; margin-bottom:1rem;">
        <div style="font-size:0.75rem; color:#888; margin-bottom:0.3rem;">FRIENDS FIND YOU WITH</div>
        <div id="idDisplay" style="font-size:1.6rem; font-weight:800; color:#00d4ff; letter-spacing:1px;">Not set</div>
        <button onclick="copyId()" style="margin-top:0.7rem; background:transparent; border:1px solid #00d4ff55; color:#00d4ff; padding:0.35rem 0.9rem; border-radius:20px; font-size:0.8rem; cursor:pointer;">Copy ID</button>
      </div>
      <p style="font-size:0.85rem; color:var(--muted); margin-bottom:0.7rem;">
        Set or change your short ID
      </p>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="usernameInput" placeholder="e.g. alvin" 
          style="flex:1; padding:0.7rem 1rem; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); outline:none; font-size:0.95rem;" />
        <button onclick="saveUsername()" 
          style="background:#00d4ff; color:#000; border:none; padding:0.7rem 1.1rem; border-radius:10px; font-weight:600; cursor:pointer;">
          Save
        </button>
      </div>
      <p id="usernameStatus" style="font-size:0.8rem; color:#00d4ff; margin-top:0.5rem;"></p>
    </div>
  </div>

  <!-- Theme -->
  <div class="section">
    <div class="section-title">Appearance</div>
    <div class="item">
      <label>Theme</label>
      <div class="theme-btns">
        <button id="btnNight" class="active" onclick="setTheme('night')">Night</button>
        <button id="btnDay" onclick="setTheme('day')">Day</button>
      </div>
    </div>
  </div>

  <!-- Wallpaper -->
  <div class="section">
    <div class="section-title">Chat Wallpaper</div>
    <div class="wallpapers" id="wallpapers">
      <div class="wall active" data-wall="default" style="background:#0a0a0a;" onclick="setWall('default')"></div>
      <div class="wall" data-wall="darkblue" style="background:linear-gradient(145deg,#0a1628,#0d2137);" onclick="setWall('darkblue')"></div>
      <div class="wall" data-wall="purple" style="background:linear-gradient(145deg,#1a0a2e,#2d1b4e);" onclick="setWall('purple')"></div>
      <div class="wall" data-wall="green" style="background:linear-gradient(145deg,#0a1f14,#0d2e1c);" onclick="setWall('green')"></div>
      <div class="wall" data-wall="dim" style="background:#121212;" onclick="setWall('dim')"></div>
      <div class="wall" data-wall="soft" style="background:linear-gradient(145deg,#1c1c1c,#2a2a2a);" onclick="setWall('soft')"></div>
      <div class="wall" data-wall="sunset" style="background:linear-gradient(145deg,#2a1a0a,#4a2c0f);" onclick="setWall('sunset')"></div>
      <div class="wall" data-wall="ocean" style="background:linear-gradient(145deg,#0a1a2a,#0d3a4a);" onclick="setWall('ocean')"></div>
      <div class="wall" data-wall="rose" style="background:linear-gradient(145deg,#2a0a1a,#4a0f2c);" onclick="setWall('rose')"></div>
      <div class="wall" data-wall="midnight" style="background:linear-gradient(145deg,#050510,#0a0a20);" onclick="setWall('midnight')"></div>
      <div class="wall" data-wall="forest" style="background:linear-gradient(145deg,#0a150a,#142814);" onclick="setWall('forest')"></div>
      <div class="wall" data-wall="carbon" style="background:repeating-linear-gradient(45deg,#111 0px,#111 2px,#1a1a1a 2px,#1a1a1a 4px);" onclick="setWall('carbon')"></div>
    </div>
  </div>

  <!-- Account -->
  <div class="section">
    <div class="section-title">Account</div>
    <div class="item" onclick="signOut()">
      <label style="color:#ff6b6b;">Sign Out</label>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="chats.html" class="nav-item"><span>💬</span>Chats</a>
    <a href="status.html" class="nav-item"><span>○</span>Status</a>
    <a href="settings.html" class="nav-item active"><span>⚙️</span>Settings</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let me = null;

    // Load saved preferences
    const savedTheme = localStorage.getItem("ct_theme") || "night";
    const savedWall = localStorage.getItem("ct_wall") || "default";
    setTheme(savedTheme, false);
    setWall(savedWall, false);

    auth.onAuthStateChanged(user => {
      if (!user) return location.href = "index.html";
      me = user;
      document.getElementById("profileName").textContent = user.displayName || "User";
      const pic = document.getElementById("profilePic");
      if (window._customPic) {
        pic.innerHTML = '<img src="' + window._customPic + '" alt="">';
      } else if (user.photoURL) {
        pic.innerHTML = '<img src="' + user.photoURL + '" alt="">';
      } else {
        pic.textContent = (user.displayName || "U").charAt(0).toUpperCase();
      }
    });

    function setTheme(theme, save = true) {
      document.body.className = theme;
      document.getElementById("btnNight").classList.toggle("active", theme === "night");
      document.getElementById("btnDay").classList.toggle("active", theme === "day");
      if (save) localStorage.setItem("ct_theme", theme);
    }

    function setWall(wall, save = true) {
      document.querySelectorAll(".wall").forEach(w => {
        w.classList.toggle("active", w.dataset.wall === wall);
      });
      if (save) localStorage.setItem("ct_wall", wall);
    }

function changePhoto() {
      const file = document.getElementById("picInput").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("profilePic").innerHTML = '<img src="' + e.target.result + '" alt="">';
        localStorage.setItem("ct_custom_pic", e.target.result);
        alert("Photo updated on this device.");
      };
      reader.readAsDataURL(file);
    }


    function saveUsername() {
      let name = document.getElementById("usernameInput").value.trim().toLowerCase();
      name = name.replace(/[^a-z0-9_]/g, "");
      if (!name || name.length < 3) {
        document.getElementById("usernameStatus").textContent = "Min 3 characters (letters/numbers)"; document.getElementById("usernameStatus").style.color = "#ff6b6b";
        return;
      }
      // Check if taken by someone else
      db.collection("coretalk_users").where("username", "==", name).limit(1).get()
        .then(snap => {
          if (!snap.empty && snap.docs[0].id !== me.uid) {
            document.getElementById("usernameStatus").textContent = "This ID is taken. Try another.";
            document.getElementById("usernameStatus").style.color = "#ff6b6b";
            return null;
          }
          return db.collection("coretalk_users").doc(me.uid).set({
            username: name,
            name: me.displayName || "User",
            email: me.email || "",
            photo: me.photoURL || "",
            uid: me.uid,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        })
        .then(result => {
          if (result === null) return;
          document.getElementById("usernameStatus").textContent = "Saved!";
          document.getElementById("idDisplay").textContent = name;
          document.getElementById("usernameStatus").style.color = "#00d4ff";
          localStorage.setItem("ct_username", name);
        })
        .catch(err => {
          console.error(err);
          document.getElementById("usernameStatus").textContent = "Error saving. Try again.";
          document.getElementById("usernameStatus").style.color = "#ff6b6b";
        });
    }


    function copyId() {
      const id = document.getElementById("idDisplay").textContent;
      if (!id || id === "Not set") return;
      navigator.clipboard.writeText(id).then(() => {
        document.getElementById("usernameStatus").textContent = "ID copied!";
      }).catch(() => {});
    }

    function loadUsername() {
      // Show saved ID immediately so it never "disappears"
      const local = localStorage.getItem("ct_username");
      if (local) {
        document.getElementById("usernameInput").value = local;
        document.getElementById("idDisplay").textContent = local;
        document.getElementById("usernameStatus").textContent = "Your ID is set";
      }
      // Then sync from cloud
      db.collection("coretalk_users").doc(me.uid).get().then(doc => {
        if (doc.exists && doc.data().username) {
          const name = doc.data().username;
          document.getElementById("usernameInput").value = name;
          document.getElementById("idDisplay").textContent = name;
          document.getElementById("usernameStatus").textContent = "Your ID is set";
          localStorage.setItem("ct_username", name);
        }
      }).catch(() => {});
    }

    function signOut() {
      auth.signOut().then(() => location.href = "index.html");
    }
  </script>
</body>
</html>
